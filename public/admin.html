<!doctype html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELTRIX — Admin</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:1050px;margin:55px auto;padding:0 20px}.admin h1{font:600 42px Oswald}.admin input,.admin select{background:#101512;border:1px solid var(--line);color:white;padding:11px}.admin button{cursor:pointer}.admin-login{display:flex;gap:10px;flex-wrap:wrap}.admin-login input{min-width:220px}.orders{margin-top:30px;display:grid;gap:12px}.order{background:var(--panel);padding:18px;border:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:15px}.order p{font-size:12px;color:var(--muted);line-height:1.8}.order b{color:var(--lime)}@media(max-width:600px){.order{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/logo.svg" alt="VELTRIX Bike Shop"><span>VELTRIX<small>ADMIN PANEL</small></span></a><a href="/">Дэлгүүр рүү →</a></header><main class="admin"><p class="eyebrow">STORE MANAGEMENT</p><h1>ЗАХИАЛГЫН УДИРДЛАГА</h1><p style="color:var(--muted);font-size:12px">Админ нууц үгээ оруулаад захиалгуудыг харах, төлөв өөрчлөх боломжтой.</p><div class="admin-login"><input id="password" type="password" placeholder="Админ нууц үг"><button class="btn primary" id="load">ЗАХИАЛГА АЧААЛАХ →</button></div><div id="message" style="font-size:12px;color:var(--lime);margin-top:12px"></div><div class="orders" id="orders"></div></main><script>
let key='';const msg=t=>document.querySelector('#message').textContent=t;async function load(){key=document.querySelector('#password').value;msg('Ачаалж байна...');try{const r=await fetch('/api/admin/orders',{headers:{'x-admin-password':key}});const data=await r.json();if(!r.ok)throw Error(data.error);msg(`${data.length} захиалга байна.`);document.querySelector('#orders').innerHTML=data.length?data.map(o=>`<article class="order"><div><b>#${o.id} · ${o.customer}</b><p>Утас: ${o.phone}<br>Хаяг: ${o.address}<br>Бараа: ${o.items.map(i=>`${i.name} × ${i.quantity}`).join(', ')}<br>Нэмэлт: ${o.note||'—'}<br>Огноо: ${new Date(o.createdAt).toLocaleString('mn-MN')}<br>Нийт: <b>${new Intl.NumberFormat('mn-MN').format(o.total)}₮</b></p></div><div><select data-status="${o.id}">${['Шинэ','Баталгаажсан','Хүргэлтэд гарсан','Хүргэгдсэн','Цуцалсан'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn primary" data-save="${o.id}" style="margin-top:8px;padding:10px">ХАДГАЛАХ</button></div></article>`).join(''):'<p style="color:var(--muted)">Одоогоор захиалга алга.</p>';}catch(e){msg(e.message);}}
document.querySelector('#load').onclick=load;document.querySelector('#orders').addEventListener('click',async e=>{const b=e.target.closest('[data-save]');if(!b)return;const id=b.dataset.save,status=document.querySelector(`[data-status="${id}"]`).value;const r=await fetch(`/api/admin/orders/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-password':key},body:JSON.stringify({status})});const d=await r.json();msg(r.ok?'Төлөв шинэчлэгдлээ.':d.error);});
</script></body></html>
